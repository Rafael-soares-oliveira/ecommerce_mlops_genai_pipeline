# =======================
# CONTEXT
# =======================
table_name: raw_data.order_items
description: "Individual items for each order. The most granular level of sales transactions."
rules:
  - "Revenue Calculation: ALWAYS use the `sale_price` column (and not the price from the `products` table) to calculate actual revenue."
  - "Item Status: Similar to orders, status is case-sensitive ('Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled'). Filter appropriately for successful sales (e.g., 'Complete')."
  - "Joins: This is the central fact table. Use foreign keys to join sales with categories (`products`), customer profiles (`users`), or costs (`inventory_items`)."
columns:
  id: "INTEGER. Primary key. Unique identifier for the order line."
  order_id: "INTEGER. FK referencing `orders(order_id)`."
  user_id: "INTEGER. FK referencing `users(id)`."
  product_id: "INTEGER. FK referencing the product model in `products(id)`."
  inventory_item_id: "INTEGER. FK referencing the physical item in `inventory_items(id)`."
  status: "TEXT. Logistics state specific to this item."
  created_at: "TIMESTAMPTZ. Date the item was added to the order."
  shipped_at: "TIMESTAMPTZ. Date the item was shipped."
  delivered_at: "TIMESTAMPTZ. Date of delivery to the customer."
  returned_at: "TIMESTAMPTZ. Date the item was returned."
  sale_price: "NUMERIC(10,2). Amount paid by the customer for this item (Revenue)."

# =======================
# FEW-SHOT
# =======================
few_shot_examples:
  - question: "What was the total revenue generated by items successfully delivered ('Complete')?"
    sql: >
      SELECT SUM(sale_price) AS total_revenue
      FROM raw_data.order_items
      WHERE status = 'Complete';
    reasoning: "Sums the `sale_price` column, which represents the actual amount paid, filtering only for items with 'Complete' status."

  - question: "What is the average ticket per item for sold products (excluding canceled and returned items)?"
    sql: >
      SELECT AVG(sale_price) AS avg_ticket
      FROM raw_data.order_items
      WHERE status NOT IN ('Cancelled', 'Returned');
    reasoning: "Calculates the average `sale_price` by explicitly excluding statuses that do not represent retained sales."

  - question: "How many distinct physical inventory items did user ID 150 purchase in total?"
    sql: >
      SELECT COUNT(DISTINCT inventory_item_id)
      FROM raw_data.order_items
      WHERE user_id = 150;
    reasoning: "Counts unique `inventory_item_id` values associated with the specified `user_id` directly in the junction table, without needing a JOIN."
