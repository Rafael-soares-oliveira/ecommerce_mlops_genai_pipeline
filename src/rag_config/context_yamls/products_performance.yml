# =======================
# CONTEXT
# =======================
table_name: metrics.products_performance
description: "Master table for product and category performance. Contains gross revenue (faturamento), sales volume, inventory efficiency, and historical metrics."
rules:
  - "Metric Distinction: `avg_days_to_sell` is historical (how long it took to sell), while `days_since_last_sale` is a recency metric."
  - "Revenue vs AOV: Use `total_revenue` for gross sales (faturamento) and `aov` for Average Order Value."
  - "Constraint: Only filter or group by `sales_year` if the user explicitly mentions a year or a specific timeframe. Otherwise, aggregate across all available years."

columns:
  product_id: "INTEGER. Foreign key to products table."
  sales_year: "NUMERIC. The year the sales occurred."
  category: "TEXT. Product category."
  product_name: "TEXT. Full product name."
  total_units_sold: "BIGINT. Total volume of units sold."
  total_revenue: "NUMERIC. Total gross revenue (faturamento) generated by this product."
  avg_shipping_days: "NUMERIC. Average days to ship."
  days_since_last_sale: "INT. Days elapsed since the most recent sale (recency)."
  stock_qt: "BIGINT. Current quantity of physical items in stock (not sold)."
  inventory_turnover: "NUMERIC. Ratio of sold units vs current stock. Higher is better."
  avg_days_to_sell: "NUMERIC. Average shelf-life of sold items."
  return_rate_pct: "NUMERIC. Percentage of units returned by customers."
  avg_margin_pct: "NUMERIC. Average profit margin percentage."
  aov: "NUMERIC. Average Order Value."

# =======================
# FEW-SHOT
# =======================
few_shot_examples:
  - question: "What was the total revenue for the Sweaters category in 2025?"
    sql: >
      SELECT SUM(total_revenue) AS revenue
      FROM metrics.products_performance
      WHERE category = 'Sweaters' AND sales_year = 2025;
    reasoning: "Uses total_revenue directly from the performance table without needing to join raw_data."

  - question: "Show me the top 10 categories with the highest sales volume."
    sql: >
      SELECT
      categories
      SUM(total_revenue) as total_revenue
      FROM metrics.products_performance
      GROUP BY 1
      ORDER BY 2 DESC
      LIMIT 10;
    reasoning: "Calculate the sum of total_revenue, sort by total_revenue descending and limit by 10."

  - question: "Show me the top 5 products with the highest quantity sold."
    sql: >
      SELECT
      product_name
      SUM(total_units_sold) as total_units_sold
      FROM metrics.products_performance
      GROUP BY 1
      ORDER BY 2 DESC
      LIMIT 10;
    reasoning: "Calculate the sum of total_units_sold, sort by total_units_sold descending and limit by 5."
