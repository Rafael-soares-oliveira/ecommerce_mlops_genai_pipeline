# =======================
# CONTEXT
# =======================
table_name: metrics.traffic_source_performance
description: "Consolidated view of marketing performance. Measures acquisition volume, orders, and conversion by channel."
rules:
  - "Marketing Shortcut: Use this view whenever the question involves the efficiency of acquisition channels (e.g., 'Organic', 'Facebook', 'Email'). Avoid manual JOINs between users, orders, and items."
columns:
  traffic_source: "TEXT. User's origin channel."
  acquired_users: "BIGINT. Total registered users originating from the channel."
  total_orders: "BIGINT. Total orders generated by this user base."
  user_conversion_rate: "NUMERIC. Conversion rate of users into buyers (%)."
  avg_ticket: "NUMERIC. Average ticket value for the channel."

# =======================
# FEW-SHOT
# =======================
few_shot_examples:
  - question: "Which traffic source has the highest user conversion rate?"
    sql: >
      SELECT traffic_source, user_conversion_rate
      FROM metrics.traffic_source_performance
      ORDER BY user_conversion_rate DESC
      LIMIT 1;
    reasoning: "Orders the pre-aggregated data by conversion rate in descending order."

  - question: "How many users came from 'Organic' traffic, and what is the average ticket for this channel?"
    sql: >
      SELECT acquired_users, avg_ticket
      FROM metrics.traffic_source_performance
      WHERE traffic_source = 'Organic';
    reasoning: "Directly filters the channel string within the analytical view."
