services:
  # --- DATA LAYER ---
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thelook_postgres
    restart: always
    shm_size: 2GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql # Garantir acesso (precaução)
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro # Read Only
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G # Modificar caso necessário
    command:
      - "postgres"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=128MB"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_worker_processes=12"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "timescaledb.max_background_workers=4"
      - "-c"
      - "jit=off"
    networks:
      - thelook-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: thelook_pgadmin
    restart: always
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - thelook-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - thelook-net
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_KV_CACHE_TYPE="q8_0"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
    image: thelook-app-stack:latest
    container_name: streamlit-ui
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app
      - duckdb_storage:/app/data/duckdb
      - sentence_transformers_cache:/app/model_cache
    ports:
      - "${STREAMLIT_PORT}:8501"
    networks:
      - thelook-net
    deploy:
      resources:
        limits:
          memory: 1.5G # Mudar caso necessário
    command:
      ["uv", "run", "streamlit", "run", "src/app.py", "--server.address", "0.0.0.0"]

  kedro-viz:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
    image: thelook-app-stack:latest
    container_name: kedro-viz-server
    profiles:
      - debug
    volumes:
      - .:/app
      - kedro_experiments_data:/app/.kedro
      - sentence_transformers_cache:/app/model_cache
    ports:
      - "${KEDRO_PORT}:4141"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /app/model_cache
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - thelook-net
    command: uv run kedro viz run --host 0.0.0.0 --port 4141 --include-hooks

  kedro-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
    image: thelook-app-stack:latest
    container_name: kedro-job-runner
    profiles:
      - etl
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /app/model_cache
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app
      - sentence_transformers_cache:/app/model_cache
      - kedro_experiments_data:/app/.kedro
      - ./data/01_raw:/app/data/01_raw:ro
      - ./sql/raw_data:/app/sql/raw_data:ro
      - ./sql/embeddings:/app/sql/embeddings:ro
    networks:
      - thelook-net
    command: ["uv", "run", "kedro", "run"]

volumes:
  pg_data:
  pgadmin_data:
  ollama_storage:
  sentence_transformers_cache:
  duckdb_storage:
  kedro_experiments_data:

networks:
  thelook-net:
    driver: bridge
